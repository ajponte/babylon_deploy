name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write    # Required for AWS OIDC authentication
  contents: read
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: "GitHubActions-Terraform-Plan"
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Check Formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Backend
        run: terraform -chdir=terraform init

      - name: Validate Configuration
        run: terraform -chdir=terraform validate

      - name: Generate Speculative Plan
        id: plan
        run: terraform -chdir=terraform plan -no-color

  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: "GitHubActions-Terraform-Apply"
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Initialize Backend
        run: terraform -chdir=terraform init

      - name: Apply Infrastructure Changes
        run: terraform -chdir=terraform apply -auto-approve
